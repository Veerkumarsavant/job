<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Ranking | ProConnect</title>
  <link rel="stylesheet" href="../css/candidate-ranking.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header class="navbar">
  <div class="nav-left">
    <h2>Candidate Ranking</h2>
  </div>
  <div class="nav-right">
    <button id="themeToggle" class="btn-icon" type="button">🌙</button>
    <button id="logoutBtn" class="btn-danger" type="button">Logout</button>
  </div>
</header>
<main class="admin-container">
  <section class="filters">
    <div class="filter-group">
      <label for="jobSelect">Select Job</label>
      <select id="jobSelect">
        <option value="">Choose a job</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="searchCandidate">Search Candidate</label>
      <input type="text"id="searchCandidate"placeholder="Search by name...">
    </div>
    <div class="filter-group">
      <label for="sortSelect">Sort By</label>
      <select id="sortSelect">
        <option value="score">Score (High → Low)</option>
        <option value="name">Name (A → Z)</option>
      </select>
    </div>
  </section>
  <section class="ranking-section">
    <div id="rankingStats" class="ranking-stats"></div>
    <div id="ranking" class="ranking-grid"></div>
    <div id="emptyState" class="empty-state hidden">  No candidates found.</div>
  </section>
  <section class="chart-section">
    <h3>Score Distribution</h3>
    <div class="chart-wrapper">
      <canvas id="distributionChart"></canvas>
    </div>
  </section>
</main>
<div id="resumeModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-content large">
    <div class="modal-header">
      <h3>Resume Preview</h3>
      <button id="closeResumeBtn" type="button">✖</button>
    </div>
    <iframe id="resumeFrame" width="100%" height="500" frameborder="0"></iframe>
  </div>
</div>
<div id="loadingOverlay" class="loading-overlay hidden">
  <div class="spinner"></div>
  <p>Loading ranking...</p>
</div>
<script src="../js/core/auth-guard.js"></script>
<script src="../js/core/theme.js"></script>
<script src="../js/utils/api.js"></script>
<script src="../js/ranking.js"></script>
</body>
</html>
