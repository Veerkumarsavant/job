<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Applicants</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #f8fafc
    );

  color:#111827;
}

/* CONTAINER */

.container{
  width:92%;
  max-width:1400px;
  margin:auto;
  padding:40px 0;
}

/* TOPBAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  flex-wrap:wrap;
  gap:20px;
}

.topbar h2{
  font-size:46px;
  font-weight:900;

  background:
    linear-gradient(
      90deg,
      #2563eb,
      #7c3aed
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* SEARCH */

.search-box input{
  width:340px;

  padding:15px 18px;

  border:none;

  border-radius:18px;

  background:white;

  font-size:15px;

  box-shadow:
    0 6px 18px rgba(15,23,42,0.08);

  transition:0.25s;
}

.search-box input:focus{
  outline:none;

  box-shadow:
    0 0 0 5px rgba(37,99,235,0.15);
}

/* FILTERS */

.filters{
  display:flex;
  gap:12px;
  margin-bottom:28px;
  flex-wrap:wrap;
}

.filters button{
  border:none;

  background:white;

  padding:12px 22px;

  border-radius:16px;

  font-weight:700;

  cursor:pointer;

  transition:0.25s;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.05);
}

.filters button:hover{
  background:#2563eb;
  color:white;

  transform:translateY(-2px);
}

.filters button.active{
  background:
    linear-gradient(
      135deg,
      #2563eb,
      #1d4ed8
    );

  color:white;

  box-shadow:
    0 10px 25px rgba(37,99,235,0.25);
}

/* CARD */

.card{
  background:
    rgba(255,255,255,0.75);

  backdrop-filter:blur(18px);

  border-radius:28px;

  padding:26px;

  margin-bottom:24px;

  display:grid;

  grid-template-columns:1fr auto;

  gap:26px;

  border:
    1px solid rgba(255,255,255,0.8);

  box-shadow:
    0 10px 35px rgba(15,23,42,0.08);

  transition:all .3s ease;
}

.card:hover{
  transform:
    translateY(-5px);

  box-shadow:
    0 20px 50px rgba(15,23,42,0.14);
}

/* USER */

.user{
  display:flex;
  align-items:flex-start;
  gap:20px;
}

.avatar{
  width:80px;
  height:80px;

  border-radius:22px;

  object-fit:cover;

  border:3px solid #dbeafe;

  background:#f8fafc;
}

.user-info{
  flex:1;
}

.user-info h3{
  font-size:24px;

  font-weight:800;

  color:#0f172a;

  display:flex;
  align-items:center;
  gap:12px;

  margin-bottom:8px;
}

.user-info p{
  font-size:14px;
  color:#64748b;
  margin-bottom:6px;
}

/* RANK */

.rank{
  background:
    linear-gradient(
      135deg,
      #2563eb,
      #1d4ed8
    );

  color:white;

  font-size:11px;

  padding:5px 12px;

  border-radius:999px;

  font-weight:700;
}

/* JOB BADGE */

.job-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;

  margin-top:10px;
  margin-bottom:12px;

  background:#eff6ff;

  color:#2563eb;

  padding:8px 14px;

  border-radius:999px;

  font-size:13px;
  font-weight:700;
}

/* META */

.user-meta{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:12px;
}

.meta-item{
  background:#f8fafc;

  padding:8px 12px;

  border-radius:12px;

  font-size:13px;

  color:#475569;

  border:1px solid #e2e8f0;
}

/* STATUS */

.status{
  display:inline-block;

  margin-top:14px;

  padding:8px 14px;

  border-radius:999px;

  font-size:12px;

  font-weight:700;

  text-transform:capitalize;
}

.applied{
  background:#e5e7eb;
  color:#374151;
}

.shortlisted{
  background:#fef3c7;
  color:#92400e;
}

.accepted{
  background:#dcfce7;
  color:#166534;
}

.rejected{
  background:#fee2e2;
  color:#991b1b;
}

/* RESUME */

.resume-link{
  display:inline-block;

  margin-top:14px;

  color:#2563eb;

  text-decoration:none;

  font-weight:700;

  font-size:14px;
}

.resume-link:hover{
  text-decoration:underline;
}

/* ACTIONS */

.actions{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:16px;
  min-width:220px;
}

.actions button{
  position:relative;
  overflow:hidden;

  border:none;
  outline:none;

  border-radius:18px;

  padding:15px 20px;

  font-size:14px;
  font-weight:800;

  cursor:pointer;

  transition:all .28s ease;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  min-width:180px;
}

.actions button::before{
  content:"";

  position:absolute;
  top:0;
  left:-120%;

  width:100%;
  height:100%;

  background:
    linear-gradient(
      120deg,
      transparent,
      rgba(255,255,255,0.4),
      transparent
    );

  transition:.6s;
}

.actions button:hover::before{
  left:120%;
}

.actions button:hover{
  transform:
    translateY(-4px)
    scale(1.02);
}

.shortlist-btn{
  background:
    linear-gradient(
      135deg,
      #fde68a,
      #facc15
    );

  color:#111827;

  box-shadow:
    0 12px 25px rgba(250,204,21,0.30);
}

.accept-btn{
  background:
    linear-gradient(
      135deg,
      #4ade80,
      #16a34a
    );

  color:white;

  box-shadow:
    0 12px 25px rgba(34,197,94,0.30);
}

.reject-btn{
  background:
    linear-gradient(
      135deg,
      #fb7185,
      #dc2626
    );

  color:white;

  box-shadow:
    0 12px 25px rgba(239,68,68,0.30);
}

.actions button:disabled{
  opacity:0.45;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

/* EMPTY */

.empty-state{
  background:white;

  border-radius:24px;

  padding:70px 40px;

  text-align:center;

  border:1px solid #dbeafe;

  box-shadow:
    0 4px 16px rgba(15,23,42,0.04);
}

.empty-state img{
  width:140px;
  margin-bottom:20px;
}

.empty-state h3{
  font-size:26px;
  margin-bottom:10px;
  color:#0f172a;
}

.empty-state p{
  color:#64748b;
}

/* LOADER */

.loader{
  text-align:center;
  padding:40px;
}

.skeleton-card{
  height:130px;

  border-radius:24px;

  margin-bottom:20px;

  background:
    linear-gradient(
      90deg,
      #e2e8f0 25%,
      #f8fafc 50%,
      #e2e8f0 75%
    );

  background-size:200% 100%;

  animation:shimmer 1.2s infinite;
}

@keyframes shimmer{

  from{
    background-position:200% 0;
  }

  to{
    background-position:-200% 0;
  }

}

/* RESPONSIVE */

@media(max-width:900px){

  .card{
    grid-template-columns:1fr;
  }

  .actions{
    width:100%;
    flex-direction:row;
  }

  .actions button{
    flex:1;
    min-width:auto;
  }

}

@media(max-width:600px){

  .topbar{
    flex-direction:column;
    align-items:flex-start;
  }

  .search-box{
    width:100%;
  }

  .search-box input{
    width:100%;
  }

  .user{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    width:100%;
    flex-direction:column;
  }

}
.avatar,
.user-info h3 {
  cursor: pointer;
  transition: 0.2s;
}

.avatar:hover,
.user-info h3:hover {
  opacity: 0.8;
}

.score-circle{
  width:70px;
  height:70px;
  min-width:70px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:14px;
  font-weight:800;
  color:#0f172a;

  background:#e5e7eb;

  position:relative;
}

.score-circle::before{
  content:"";

  position:absolute;
  inset:6px;

  background:white;

  border-radius:50%;

  z-index:0;
}

.score-circle span{
  position:relative;
  z-index:2;
}

.score-circle{
  display:flex;
  align-items:center;
  justify-content:center;
}


.timeline{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

.timeline span{
  padding:6px 12px;
  border-radius:999px;

  font-size:12px;
  font-weight:600;

  background:#e5e7eb;
  color:#475569;
}

.timeline span.done{
  background:#dcfce7;
  color:#166534;
}

.stats-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

  gap:20px;
  margin-bottom:30px;
}

.stat-card{
  background:white;

  padding:24px;

  border-radius:24px;

  text-align:center;

  box-shadow:
    0 10px 30px rgba(0,0,0,.06);

  transition:.3s;
}

.stat-card:hover{
  transform:translateY(-4px);
}

.stat-card h3{
  font-size:34px;
  color:#2563eb;
  margin-bottom:8px;
}

.stat-card p{
  color:#64748b;
}


.final-status{
  padding:18px;
  border-radius:18px;

  font-weight:700;
  text-align:center;
}

.final-status.accepted{
  background:#dcfce7;
  color:#166534;
}

.final-status.shortlisted{
  background:#fef3c7;
  color:#92400e;
}

.final-status.rejected{
  background:#fee2e2;
  color:#991b1b;
}

.card::before{
  content:"";

  position:absolute;
  inset:0;

  border-radius:28px;

  padding:1px;

  background:
    linear-gradient(
      135deg,
      rgba(37,99,235,.25),
      rgba(124,58,237,.25)
    );

  -webkit-mask:
    linear-gradient(#fff 0 0)
    content-box,
    linear-gradient(#fff 0 0);

  -webkit-mask-composite:xor;

  pointer-events:none;
}

.card{
  position:relative;
}

</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>Applicants</h2>
    <div class="search-box">
      <input id="searchInput"type="text"placeholder="Search applicants..."/>
    </div>
  </div>
  <div class="filters">
    <button onclick="setFilter('all')">All</button>
    <button onclick="setFilter('applied')">Applied</button>
    <button onclick="setFilter('shortlisted')">Shortlisted</button>
    <button onclick="setFilter('accepted')">Accepted</button>
    <button onclick="setFilter('rejected')">Rejected</button>
  </div>
  <div id="applicantsContainer" class="loader">Loading...</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io(
  window.location.origin,
  {
    auth: {
      token:
        localStorage.getItem(
          "accessToken"
        )
    }
  }
);

let currentFilter = "all";
let allApplicants = [];
let debounceTimer;

const STATUS_CONFIG = {
  applied:{className:"applied",score:2},
  shortlisted:{className:"shortlisted",score:3},
  accepted:{className:"accepted",score:4},
  rejected:{className:"rejected",score:1}
};


function escapeHTML(str){

  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function safeURL(url){try{return new URL(url,window.location.origin).href;}catch{return "#";}}

socket.on("applicationUpdated",updated => {

    const index =allApplicants.findIndex(
        a => a._id === updated._id
      );

    if(index !== -1){

      allApplicants[index] = {
        ...allApplicants[index],
        ...updated
      };

      renderApplicants();
    }
  }
);

socket.on("recruiterApplicationUpdated",updated => {

    const index =allApplicants.findIndex(
        a => a._id === updated._id
      );

    if(index !== -1){
      allApplicants[index] = {
        ...allApplicants[index],
        ...updated
      };
      renderApplicants();
    }
  }
);


document.addEventListener(
  "DOMContentLoaded",
  ()=>{
    const token =localStorage.getItem("accessToken");
    if(!token){
      location.href ="/auth/login.html";
      return;

    }
    setupSearch();
    setFilter("all");
    loadApplicants();
  }
);

function setupSearch(){
  const input =document.getElementById("searchInput");
  input.addEventListener("input",()=>{
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderApplicants,300);
    }
  );
}

function setFilter(filter){
  currentFilter = filter;
  document.querySelectorAll(".filters button").forEach(btn=>{
      btn.classList.remove("active");
      const text =btn.textContent.trim().toLowerCase();
      if(text.includes(filter)){
        btn.classList.add("active");
      }
    });
  renderApplicants();
}


async function loadApplicants() {
  const container =document.getElementById("applicantsContainer");
  const token =localStorage.getItem("accessToken");
  if (!container) return;
  try {
    container.innerHTML = `
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    `;

    const res = await fetch(
      "/api/applications/recruiter",
      {
        headers: {
          Authorization:
            "Bearer " + token
        }
      }
    );

    if (res.status === 401) {
      location.href ="/auth/login.html";
      return;
    }

    if (!res.ok) {
      throw new Error(
        "Failed to load applications"
      );
    }

    const result =await res.json();
    allApplicants =result?.data || [];
    renderApplicants();
  } catch (err) {
    console.error("Load applicants error:",err);

    container.innerHTML = `
      <div class="empty-state">
        <h3>
          Error Loading Applications
        </h3>
      </div>
    `;
  }
}

function openUserProfile(userId) {
  if (!userId) return;

  window.location.href = `/user/profile.html?id=${userId}&viewOnly=true`;
}


function renderApplicants() {
  const container =document.getElementById("applicantsContainer");
  const searchInput =document.getElementById("searchInput");

const search =searchInput? searchInput.value.toLowerCase(): "";
  if (!container) return;

  if (!allApplicants.length) {

    container.innerHTML = `
      <div class="empty-state">
        <img
          src="/images/empty.svg"
          alt="Empty"
        >
        <h3>No Applications Yet</h3>
        <p>
          Applications will appear
          here when candidates apply.
        </p>
      </div>
    `;

    return;
  }


const filtered = allApplicants

  .filter(app => {
    if (
      currentFilter === "all" &&
      app.status === "rejected"
    ) {
      return false;
    }

    if (
      currentFilter !== "all" &&
      app.status !== currentFilter
    ) {
      return false;
    }

    const applicantName =(  app.applicant?.name || "").toLowerCase();
    const jobTitle =(app.job?.title || "").toLowerCase();

    return (
      applicantName.includes(search) ||
      jobTitle.includes(search)
    );
  }) 


    .map(app => ({
      ...app,
      score:
        STATUS_CONFIG[
          app.status
        ]?.score || 1
    }))

    .sort(
      (a, b) => b.score - a.score
    );


  if (!filtered.length) {

    container.innerHTML = `
      <div class="empty-state">
        <h3>No Matching Candidates</h3>
      </div>
    `;

    return;
  }

  container.replaceChildren();
  const fragment =document.createDocumentFragment();
  filtered.forEach(app => {
    const user =app.applicant || {};
    const statusClass =STATUS_CONFIG[app.status]?.className || "applied";
    const card =document.createElement("div");
    card.className = "card";

    const userSection = document.createElement("div");
    userSection.className = "user";

    const avatar =document.createElement("img");
    avatar.className = "avatar";
   avatar.src =
  user.avatar
    ? (
        user.avatar.startsWith("http")
          ? user.avatar
          : `${window.location.origin}${user.avatar}`
      )
    : "/images/default-avatar.png";

    avatar.alt = "Avatar";
    avatar.onerror = function () {
      this.onerror = null;
      this.src ="/images/default-avatar.png";
    };

    avatar.style.cursor = "pointer";
    avatar.addEventListener("click",() => openUserProfile(user._id));


    const info =document.createElement("div");
    info.className = "user-info";
    const name =document.createElement("h3");
    name.textContent =user.name || "No Name";
    name.style.cursor = "pointer";
    name.addEventListener(
  "click",
  () => openUserProfile(user._id)
);

    const scoreCircle =document.createElement("div");

scoreCircle.className ="score-circle";

const score =
  Math.min(
    100,
    60 + app.score * 10
  );

scoreCircle.style.background =
  `conic-gradient(
    #2563eb ${score}%,
    #e5e7eb 0
  )`;

scoreCircle.innerHTML =`<span>${score}%</span>`;

userSection.append(
  scoreCircle,
  avatar,
  info
);

    const email =document.createElement("p");
    email.textContent =user.email || "";

    const badge =document.createElement("div");
    badge.className = "job-badge";
    badge.textContent =`💼 ${app.job?.title || "Unknown Job"}`;

    const meta =document.createElement("div");
    meta.className ="user-meta";

    const company =document.createElement("div");
    company.className ="meta-item";
    company.textContent =`🏢 ${app.job?.company || "N/A"}`;

    const location =document.createElement("div");
    location.className ="meta-item";
    location.textContent =`📍 ${app.job?.location || "N/A"}`;
    meta.append(company,location);

    if (app.job?.salary?.min) {
      const salary =document.createElement("div");
      salary.className ="meta-item";
      salary.textContent =app.job?.salary?.min? `💰 ₹${app.job.salary.min} - ₹${app.job.salary.max}`: "💰 Salary Not Disclosed";
      meta.appendChild(salary);
    }

    const status =document.createElement("span");
    status.className =`status ${statusClass}`;
    status.textContent =app.status;
    const timeline =
  document.createElement("div");

timeline.className =
  "timeline";

timeline.innerHTML = `
  <span class="done">
    Applied
  </span>

  <span class="${
    app.status === "shortlisted" ||
    app.status === "accepted"
      ? "done"
      : ""
  }">
    Shortlisted
  </span>

  <span class="${
    app.status === "accepted"
      ? "done"
      : ""
  }">
    Hired
  </span>
`;

info.appendChild(timeline);

let resumeEl;

if (user.resume) {
  resumeEl =document.createElement("a");
  resumeEl.className ="resume-link";
  //resumeEl.href =safeURL(user.resume);
  resumeEl.href =
  user.resume.startsWith("http")
    ? user.resume
    : `${window.location.origin}${user.resume}`;

  resumeEl.target ="_blank";
  resumeEl.rel ="noopener noreferrer";
  resumeEl.textContent ="View Resume →";

} else {

  resumeEl =document.createElement("p");
  resumeEl.className ="meta-item";
  resumeEl.textContent ="No Resume Uploaded";
}

info.append(name,email,badge,meta,status,resumeEl);

const actions =document.createElement("div");
actions.className ="actions";
    if (
      app.status === "applied"
    ) {

      const shortlistBtn =createActionButton("⭐ Shortlist","shortlist-btn",() =>updateStatus(app._id,"shortlisted"));
      const acceptBtn =createActionButton("✓ Hire","accept-btn",() =>updateStatus(app._id,"accepted"));
      const rejectBtn =createActionButton("✕ Reject","reject-btn",() =>updateStatus(app._id,"rejected"));
      actions.append(shortlistBtn,acceptBtn,rejectBtn);
    } else {

      const final =document.createElement("div");
      final.className =`final-status ${statusClass}`;

      final.innerHTML = `
  <strong>
    ${
      app.status === "accepted"
        ? "✓ Candidate Hired"
        : app.status === "rejected"
        ? "✕ Candidate Rejected"
        : "⭐ Candidate Shortlisted"
    }
  </strong>
`;

      actions.appendChild(final);
    }

    card.append(userSection,actions);
    fragment.appendChild(card);
  });

  container.appendChild(fragment);
}


function createActionButton(
  text,
  className,
  onClick
) {

  const btn =
    document.createElement("button");

  btn.className = className;

  btn.textContent = text;

  btn.onclick = async () => {

    if (btn.disabled) return;

    btn.disabled = true;

    try {

      await onClick();

    } finally {

      btn.disabled = false;

    }

  };

  return btn;
}

async function updateStatus(id,status){
  const token =localStorage.getItem("accessToken");
  const app = allApplicants.find(a => a._id === id);
  if(!app) return;
  const previous =app.status;
  app.status = status;
  renderApplicants();

  try{
    const res = await fetch(
      `/api/applications/${id}/status`,
      {
        method:"PUT",
        headers:{
          "Content-Type":
            "application/json",

          Authorization:
            "Bearer " + token
        },

        body:JSON.stringify({
          status
        })
      }
    );

    const data =await res.json();
    if(res.status === 401){
      location.href ="/auth/login.html";
      return;
    }

    if(!res.ok){
      throw new Error(data.message || "Update failed");
    }

  }catch(err){
    console.error(err);
    app.status = previous;
    renderApplicants();
    alert(err.message);
  }
}
</script>
</body>
</html>
