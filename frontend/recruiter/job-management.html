<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Management | ProConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/job-management.css">
</head>
<body>
<div class="recruiter-app">
  <aside class="sidebar">
    <h2 class="logo">ProConnect</h2>
    <nav>
      <a href="interviews.html">Interviews</a>
      <hr>
      <a href="dashboard.html">Dashboard</a>
      <a href="applicants.html">Applicants</a>
      <a href="job-management.html" class="active">Job Management</a>
      <a href="analytics.html">Analytics</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <h3>Job Management</h3>
      <button id="logoutBtn" class="btn-secondary" onclick="logout()">Logout</button>
    </header>
    <section class="content">
      <div class="card">
        <h3>Create Job</h3>
        <form id="createJobForm">
          <input id="title" placeholder="Job Title" required>
          <input id="company" placeholder="Company" required>
          <input id="location" placeholder="Location" required>
          <input id="role" placeholder="Role">
          <textarea id="description" placeholder="Job Description" required></textarea>
          <input id="skills" placeholder="Skills (React, Node...)">
          <div class="row">
            <input id="salaryMin" placeholder="Min Salary">
            <input id="salaryMax" placeholder="Max Salary">
          </div>
          <select id="experience">
            <option value="">Experience</option>
            <option value="0-2">0-2</option>
            <option value="2-5">2-5</option>
            <option value="5+">5+</option>
          </select>
          <button type="submit" class="btn-primary">Post Job</button>
        </form>
      </div>
      <div class="card">
        <div class="controls">
          <input id="searchInput" placeholder="Search jobs...">
          <input id="skillFilter" placeholder="Filter by skill">
          <input id="minSalaryFilter" placeholder="Min Salary">
          <input id="maxSalaryFilter" placeholder="Max Salary">
          <select id="sortSelect">
            <option value="">Sort</option>
            <option value="salaryLow">Salary ↑</option>
            <option value="salaryHigh">Salary ↓</option>
            <option value="newest">Newest</option>
            <option value="experience">Experience</option>
          </select>
          <button id="clearFiltersBtn">Clear</button>
          <span id="jobCount"></span>
        </div>
        <div id="jobList" class="job-grid"></div>
        <div id="emptyState" class="hidden empty-state">
          <p>No jobs found</p>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <h3>Edit Job</h3>
    <input id="editTitle">
    <input id="editCompany">
    <input id="editLocation">
    <input id="editRole">
    <textarea id="editDescription"></textarea>
    <input id="editSkills">
    <div class="row">
      <input id="editSalaryMin">
      <input id="editSalaryMax">
    </div>
    <select id="editExperience">
      <option value="0-2">0-2</option>
      <option value="2-5">2-5</option>
      <option value="5+">5+</option>
    </select>
    <div class="modal-actions">
      <button id="saveEditBtn" class="btn-primary">Save</button>
      <button id="closeModalBtn">Cancel</button>
    </div>
  </div>
</div>
<div id="deleteModal" class="modal hidden">
  <div class="modal-content">
    <h3>Delete Job</h3>
    <p>Are you sure?</p>
    <div class="modal-actions">
      <button id="confirmDeleteBtn" class="btn-danger">Delete</button>
      <button id="cancelDeleteBtn">Cancel</button>
    </div>
  </div>
</div>
<div id="toastContainer" class="toast-container"></div>
<div id="loadingOverlay" class="loading hidden">
  <div class="spinner"></div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/job-management.js"></script>
<script>
(async () => {
  const user = await requireAuth("recruiter");
  if (!user) return;
})();
function logout() {
  localStorage.removeItem("token");
  window.location.href = "/index.html";
}
</script>
</body>
</html>
