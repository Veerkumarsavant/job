<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages | ProConnect</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/message.css">
</head>
<body>
<div class="messaging-container">
  <aside class="conversation-list">
    <div class="conversation-header">
      <h3> Messages
      </h3>
      <input type="text" id="searchInput" class="search-input" placeholder="Search messages..." autocomplete="off">
    </div>
    <div id="conversationList">
      <div class="empty-chat"> No conversations yet</div>
    </div>
    <div class="notif-wrapper"></div>
  </aside>
  <main class="chat-window">
    <div class="chat-header">
      <div class="chat-user-info">
        <div class="chat-avatar" id="chatAvatar">
          <img src="/images/default-avatar.png" alt="User">
        </div>
        <div>
          <div id="chatUser"> Select a conversation</div>
          <div class="online-status">
            <span class="online-dot" id="headerOnlineDot"></span>
            <span id="onlineText"> Offline</span>
          </div>
        </div>
      </div>
    </div>
    <section id="messages" class="messages">
      <div class="chat-placeholder">
        <i class="fa-regular fa-comments"></i>
        <p> Select a conversation to start chatting</p>
      </div>
    </section>
    <div id="typingIndicator" class="typing-indicator" style="display:none">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="message-input">
      <label class="icon-btn" title="Send image">
        <i class="fa-regular fa-image"></i>
        <input type="file" id="imageUpload" accept="image/*" hidden>
      </label>
      <button id="recordBtn" class="icon-btn" type="button">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <input id="messageInput" type="text" placeholder="Write a message..." autocomplete="off">
      <button id="sendBtn"class="send-btn"type="button">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
    <audio id="voicePreview" controls style="display:none"></audio>
  </main>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/config.js"></script>
<script src="/js/utils/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/user/message.js"></script>
</body>
</html>
