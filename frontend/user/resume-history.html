<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume History | ProConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/history.css">
</head>
<body>
<div class="history-app">
  <aside class="sidebar">
    <h2>ProConnect</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="resume-builder.html">Resume Builder</a>
    <a class="active">Resume History</a>
  </aside>
  <div class="main">
    <header class="topbar">
      <h3>Resume Version History</h3>
      <div>
        <button id="themeToggle" class="btn-icon">🌙</button>
        <button id="logoutBtn" class="btn-danger">Logout</button>
      </div>
    </header>
    <div class="content"><div class="card version-list"><h4>Saved Versions</h4><div id="historyList"></div></div>
      <div class="card diff-view"><h4>Changes Preview</h4><pre id="diff"></pre></div>
    </div>
  </div>
</div>
<script src="../js/utils/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/user/resume.js"></script>
<script>
const themeBtn = document.getElementById("themeToggle");
const logoutBtn = document.getElementById("logoutBtn");
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}

themeBtn.onclick = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
};

logoutBtn.onclick = logout;
</script>
</body>
</html>
