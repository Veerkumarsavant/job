<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #dbeafe, #ffffff, #cffafe);
      padding: 20px;
    }

    .feedback-container {
      width: 100%;
      max-width: 700px;
      background: #fff;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .feedback-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .feedback-header h1 {
      font-size: 40px;
      color: #1f2937;
      margin-bottom: 10px;
    }

    .feedback-header p {
      color: #6b7280;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      color: #374151;
    }

    .form-control {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .form-control:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79,70,229,0.15);
    }

    textarea {
      resize: none;
    }

    .rating-box {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .rating-btn {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .rating-btn:hover {
      background: #4f46e5;
      color: white;
      transform: scale(1.08);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: #4f46e5;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: #3730a3;
    }

    .footer-text {
      text-align: center;
      margin-top: 25px;
      color: #9ca3af;
      font-size: 14px;
    }

    @media(max-width: 600px) {
      .feedback-container {
        padding: 25px;
      }

      .feedback-header h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <div class="feedback-container">
    <div class="feedback-header">
      <h1>Feedback Form</h1>
      <p>Share your feedback and help us improve.</p>
    </div>
    <form>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text"class="form-control"placeholder="Enter your full name"/>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" placeholder="Enter your email"/>
      </div>

      <div class="form-group">
        <label>Rate Your Experience</label>

        <div class="rating-box">
          <button type="button" class="rating-btn">1</button>
          <button type="button" class="rating-btn">2</button>
          <button type="button" class="rating-btn">3</button>
          <button type="button" class="rating-btn">4</button>
          <button type="button" class="rating-btn">5</button>
        </div>
      </div>

      <div class="form-group">
        <label>Your Feedback</label>
        <textarea rows="5" class="form-control" placeholder="Write your feedback here..."></textarea>
      </div>

      <div class="form-group">
        <label>Suggestions</label>
        <input type="text" class="form-control"placeholder="Any suggestions?"/>
      </div>
      <button type="submit" class="submit-btn">Submit Feedback</button>
    </form>
    <div class="footer-text">Thank you for your valuable feedback.</div>
  </div>

</body>
</html>
