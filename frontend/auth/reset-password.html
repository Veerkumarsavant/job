<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set New Password | ProConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/reset-password.css">
</head>
<body>
<div class="auth-wrapper">
<div class="auth-card">
<h2>Create New Password</h2>
<p class="auth-subtext">Choose a strong password to secure your account.</p>
<form id="resetForm">
<input type="hidden" id="token">
<input type="password"id="password"placeholder="New Password"required>
<input type="password" id="confirmPassword" placeholder="Confirm Password" required>
<input type="text" id="otp" placeholder="Enter 2FA Code (if enabled)">
<button type="submit" id="submitBtn" class="primary-btn">Reset Password</button>
</form>
<div id="strengthBar" class="strength-bar"></div>
<div id="successBox" class="success-box" style="display:none">✔ Password reset successful</div>
<p id="message" class="auth-message"></p>
</div>
</div>
<script src="/js/auth.js"></script>
<script src="../js/reset-password.js"></script>
<script src="/js/config.js"></script>
</body>
</html>
