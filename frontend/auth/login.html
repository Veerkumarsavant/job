<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | ProConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="auth-wrapper">
<form id="loginForm" class="auth-card">
<h2>Welcome Back</h2>
<p class="auth-subtitle">Login to continue</p>
<div class="form-group">
<label>Email</label>
<input type="email" id="email" required>
</div>
<div class="form-group">
<label>Password</label>
<div class="password-wrapper">
<input type="password" id="password" required>
<button type="button" id="togglePassword">👁</button>
</div>
</div>
<div id="errorMsg" class="error-msg"></div>
<button type="submit" id="loginBtn">
<span id="btnText">Login</span>
<span id="spinner" class="spinner hidden"></span>
</button>
<p class="auth-footer">
Don’t have an account?
<a href="register.html">Register</a>
<br>
<a href="forgot-password.html">Forgot Password?</a>
<button type="button" onclick="googleLogin()" class="google-btn">🔵 Continue with Google</button>
</p>
</form>
</div>
<div id="successOverlay" class="success-overlay hidden">
  <div class="success-box">
    <svg viewBox="0 0 52 52" class="checkmark">
      <circle cx="26" cy="26" r="25" fill="none"/>
      <path fill="none" d="M14 27l7 7 16-16"/>
    </svg>
    <p>Login Successful</p>
  </div>
</div>
<div class="checkmark">
<div class="checkmark-circle"></div>
<div class="checkmark-stem"></div>
<div class="checkmark-kick"></div>
</div>
</div>
</div>
<script src="../js/config.js"></script>
<script src="../js/utils/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/auth/login.js"></script> 

</body>
</html>
