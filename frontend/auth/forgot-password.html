<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password | ProConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/images/favicon.ico">
<link rel="stylesheet" href="../css/forgot-password.css">
<script src="../js/user/forgot-password.js" defer></script>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Reset Your Password</h2>
    <p class="auth-subtext">Enter your email or phone to receive reset instructions.</p>
    <div class="reset-toggle">
      <button id="emailToggle" class="active" type="button">Email</button>
      <button id="smsToggle" type="button">SMS</button>
    </div>
    <form id="forgotForm" novalidate> 
      <div id="emailSection">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"autocomplete="email" required>
      </div>
      <div id="smsSection" style="display:none;">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number" autocomplete="tel" pattern="[6-9][0-9]{9}"
inputmode="numeric">
      </div>
      <input type="hidden" name="csrfToken" id="csrfToken">
      <button type="submit" id="submitBtn" class="primary-btn">
        <span id="btnText">Send Reset Instructions</span>
        <span id="btnLoader" class="spinner hidden"></span>
      </button>
    </form>
    <p id="resendTimer" class="resend-text"></p>
    <div id="successBox" class="success-box hidden">
      <div class="checkmark">✔</div>
      <p>Check your email or phone for reset instructions</p>
    </div>
    <p id="message" class="auth-message"></p>
    <div class="security-warning">  ⚠ We will never ask for your password, OTP, or personal details via email or SMS.</div>
    <div class="auth-footer">
      <a href="/auth/login.html">Back to Login</a>
    </div>
  </div>
</div>
</body>
</html>
