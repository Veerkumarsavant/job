<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verified | ProConnect</title>
<style>
body{
 font-family:Arial, sans-serif;
 background:#f5f6fa;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
}
.card{
 background:white;
 padding:40px;
 width:400px;
 text-align:center;
 border-radius:12px;
 box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.check{
 font-size:60px;
 color:#2ecc71;
 margin-bottom:10px;
}

button{
 margin-top:20px;
 padding:12px 25px;
 background:#2ecc71;
 border:none;
 color:white;
 font-size:16px;
 border-radius:6px;
 cursor:pointer;
}

button:hover{
 background:#27ae60;
}

</style>
</head>
<body>
<div class="card">
<div class="check">✔</div>
<h2>Email Verified Successfully</h2>
<p>Your account is now active.</p>
<button onclick="goLogin()">Login Now</button>
</div>
<script>
function goLogin(){
 window.location.href="/auth/login.html";
}
</script>
</body>
</html>
